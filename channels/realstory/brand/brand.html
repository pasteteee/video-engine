<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Archivo;src:url(fonts/Archivo-wdth-wght.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Newsreader;src:url(fonts/Newsreader-opsz-italic.woff2) format('woff2');font-style:italic;font-weight:200 800}
@font-face{font-family:Plex;src:url(fonts/IBMPlexMono-500.woff2) format('woff2');font-weight:500}
:root{
  --ink:#0e0f11; --graphite:#1b1d21; --bone:#f2efe8; --paper:#ece8df; --muted:#a4a199; --signal:#e2231a;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#333}
.art{position:relative;overflow:hidden;background:var(--ink);color:var(--bone)}
.wm{font-family:Archivo;font-stretch:62%;font-weight:860;letter-spacing:-.01em;line-height:.86;text-transform:uppercase;white-space:nowrap}
.stop{display:inline-block;background:var(--signal);vertical-align:baseline}
.mono{font-family:Plex;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
.grain{position:absolute;inset:0;pointer-events:none;opacity:.12;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head>
<body>

<!-- 1. wordmark on transparent -->
<div id="wordmark" style="width:2000px;height:520px;display:flex;align-items:center;justify-content:center;background:transparent">
  <div class="wm" style="font-size:300px;color:var(--bone)">Real Story<span class="stop" style="width:.34em;height:.7em;margin-left:.08em"></span></div>
</div>

<!-- 2. avatar 800 -->
<div id="avatar" class="art" style="width:800px;height:800px">
  <div class="wm" style="position:absolute;left:96px;top:190px;font-size:236px;line-height:.84">Real<br>Story<span class="stop" style="width:.3em;height:.7em;margin-left:.07em"></span></div>
  <div class="grain"></div>
</div>

<!-- 3. watermark 300 transparent -->
<div id="watermark" style="width:300px;height:300px;display:flex;align-items:center;justify-content:center;background:transparent">
  <div class="wm" style="font-size:96px;line-height:.84;color:#fff;opacity:.92">Real<br>Story<span class="stop" style="width:.3em;height:.7em;margin-left:.07em"></span></div>
</div>

<!-- 4. banner 2560x1440 : safe area 1546x423 centred -->
<div id="banner" class="art" style="width:2560px;height:1440px">
  <div id="strip" style="position:absolute;inset:0;display:flex;gap:10px;align-items:center;justify-content:center;opacity:.72"></div>
  <div style="position:absolute;inset:0;background:radial-gradient(ellipse 52% 38% at 50% 50%, var(--ink) 55%, rgba(14,15,17,.35) 100%)"></div>
  <div style="position:absolute;left:0;right:0;top:560px;text-align:center">
    <div class="wm" style="font-size:250px">Real Story<span class="stop" style="width:.34em;height:.7em;margin-left:.08em"></span></div>
    <div class="mono" style="font-size:30px;color:var(--muted);margin-top:34px">True stories, shown with the original records</div>
  </div>
  <div class="grain"></div>
</div>

<script>
// banner side strips: archival photos passed as ?photos=a.jpg,b.jpg
const ph = new URLSearchParams(location.search).get('photos');
if (ph) { const s = document.getElementById('strip');
  ph.split(',').forEach((p,i)=>{ const d=document.createElement('div'); d.style.cssText=`width:300px;height:1440px;flex:none;background:url(${p}) center/cover;filter:grayscale(1) contrast(1.1) brightness(1.05);${i===3?'margin-left:1100px;':''}`; s.appendChild(d); }); }
</script>
</body></html>
