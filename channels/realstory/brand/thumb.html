<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Archivo;src:url(fonts/Archivo-wdth-wght.woff2) format('woff2');font-weight:100 900;font-stretch:62% 125%}
@font-face{font-family:Plex;src:url(fonts/IBMPlexMono-500.woff2) format('woff2');font-weight:500}
:root{--ink:#0e0f11;--bone:#f2efe8;--signal:#e2231a}
*{margin:0;box-sizing:border-box}
body{width:1280px;height:720px;overflow:hidden;background:var(--ink)}
.base{position:absolute;inset:0;background-size:cover;filter:contrast(1.12) saturate(1.08)}
.shade{position:absolute;inset:0}
.words{position:absolute;left:56px;font-family:Archivo;font-stretch:62%;font-weight:880;text-transform:uppercase;line-height:.86;letter-spacing:-.005em}
.words div{white-space:nowrap;text-shadow:-4px 0 0 rgba(0,220,255,.55),0 6px 30px rgba(0,0,0,.65),0 2px 4px rgba(0,0,0,.6)}
.l1{color:var(--bone)} .l2{color:var(--signal)}
.tag{position:absolute;right:40px;top:34px;font-family:Plex;font-weight:500;font-size:24px;letter-spacing:.14em;color:var(--bone);text-transform:uppercase;text-shadow:0 2px 14px rgba(0,0,0,.9)}
.tag b{display:inline-block;width:14px;height:20px;background:var(--signal);margin-right:12px;vertical-align:-2px}
svg{position:absolute;inset:0}
.inset{position:absolute;border:5px solid var(--signal);box-shadow:0 14px 40px rgba(0,0,0,.6);background:#000}
.inset img{display:block;width:100%}
.inset .cap{position:absolute;left:0;top:100%;margin-top:8px;font-family:Plex;font-weight:500;font-size:19px;letter-spacing:.12em;color:var(--bone);white-space:nowrap;text-shadow:0 2px 10px rgba(0,0,0,.95)}
.badge{position:absolute;padding:8px 18px 6px;background:var(--signal);border:4px solid var(--bone);font-family:Archivo;font-stretch:70%;font-weight:860;font-size:46px;letter-spacing:.02em;color:var(--bone);text-transform:uppercase;box-shadow:0 8px 24px rgba(0,0,0,.5);white-space:nowrap}
.grain{position:absolute;inset:0;opacity:.14;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='240' height='240'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
</style></head><body>
<div class="base" id="base"></div><div class="shade" id="shade"></div>
<svg width="1280" height="720"><path id="circle" fill="none" stroke="#e2231a" stroke-width="7" stroke-linecap="round" style="filter:drop-shadow(0 2px 6px rgba(0,0,0,.6))"/></svg>
<div id="extras"></div><div class="words" id="words"></div><div class="tag" id="tag"></div><div class="grain"></div>
<script>
// ?v=<json>: {img, pos, l1, l2, size1, size2, top, tag, circle:[cx,cy,rx,ry,rot], shade,
//   inset:{src,x,y,w,rot,cap} (evidence card: a real document of the episode), badge:{text,x,y,rot}}
const v = JSON.parse(decodeURIComponent(location.search.slice(3)));
base.style.backgroundImage = `url(${v.img})`; base.style.backgroundPosition = v.pos || 'center';
if (v.zoom) { base.style.backgroundSize = v.zoom; }
shade.style.background = v.shade || 'linear-gradient(90deg, rgba(14,15,17,.72) 0%, rgba(14,15,17,.25) 45%, rgba(14,15,17,0) 70%)';
words.style.top = (v.top || 170) + 'px';
words.innerHTML = `<div class="l1" style="font-size:${v.size1 || 170}px">${v.l1}</div><div class="l2" style="font-size:${v.size2 || 210}px">${v.l2}</div>`;
tag.innerHTML = `<b></b>${v.tag}`;
let ex = '';
if (v.inset) { const i = v.inset; ex += `<div class="inset" style="left:${i.x}px;top:${i.y}px;width:${i.w}px;transform:rotate(${i.rot || 0}deg)"><img src="${i.src}"><div class="cap">${i.cap || ''}</div></div>`; }
if (v.badge) { const b = v.badge; ex += `<div class="badge" style="left:${b.x}px;top:${b.y}px;transform:rotate(${b.rot ?? -4}deg)">${b.text}</div>`; }
extras.innerHTML = ex;
if (v.circle) { // hand-drawn ellipse: a little over one turn, wobbly
  const [cx, cy, rx, ry, rot] = v.circle; let d = ''; const n = 64;
  for (let i = 0; i <= n * 1.12; i++) { const t = (i / n) * Math.PI * 2 - 0.6; const w = 1 + 0.035 * Math.sin(t * 2 + 1.3) + 0.02 * Math.sin(t * 3.1);
    const x = rx * w * Math.cos(t), y = ry * w * Math.sin(t) * (1 + i / n * 0.06), r = (rot || -8) * Math.PI / 180;
    d += (i ? 'L' : 'M') + (cx + x * Math.cos(r) - y * Math.sin(r)).toFixed(1) + ' ' + (cy + x * Math.sin(r) + y * Math.cos(r)).toFixed(1) + ' '; }
  circle.setAttribute('d', d); }
</script></body></html>
