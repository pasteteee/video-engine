[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "face-engine"
version = "0.1.0"
description = "Behavioural face, head, gaze, posture and gesture analysis with LLM-readable output"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mediapipe = ["mediapipe>=0.10.14", "opencv-python-headless>=4.8"]
dev = ["pytest>=8"]

[project.scripts]
face-engine = "face_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["mediapipe: needs mediapipe, models and sample media (set FACE_ENGINE_SAMPLES)"]

[tool.ruff]
line-length = 100
